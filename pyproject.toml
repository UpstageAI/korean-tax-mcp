[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "korean-tax-mcp"
version = "0.3.0"
description = "Korea (South Korea) tax law MCP server — NTS rulings, court and tax tribunal decisions, basic rules, tax treaties, point-in-time statutes. 한국 세법 근거 MCP"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mcp>=2.2", "uvicorn>=0.30"]

[project.optional-dependencies]
pdf = ["pypdf>=4"]
keywords = ["mcp", "mcp-server", "korea", "south-korea", "korean", "tax", "tax-law", "nts", "transfer-pricing", "tax-treaty", "세법", "국세청", "세무"]

[project.scripts]
korean-tax-mcp = "korean_tax_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["korean_tax_mcp"]
