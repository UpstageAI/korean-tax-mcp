[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "korean-tax-mcp"
version = "0.23.2"
description = "Korea (South Korea) tax law MCP server (53 tools) — point-in-time statutes, NTS rulings, court and tribunal decisions, 96 tax treaties and withholding rates, residency and PE tests, transfer pricing; for foreign companies and expats too. 한국 세법 근거 MCP"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mcp>=2.2", "uvicorn>=0.30"]
keywords = ["mcp", "mcp-server", "korea", "south-korea", "korean", "tax", "tax-law", "korean-tax-law", "nts", "nts-rulings", "court-cases", "tax-treaty", "tax-treaties", "permanent-establishment", "residency", "tax-residency", "withholding-tax", "nonresident", "transfer-pricing", "international-tax", "expat", "foreign-company", "korean-subsidiary", "세법", "국세청", "세무"]

[project.urls]
Homepage = "https://upstageai.github.io/korean-tax-mcp/"
Repository = "https://github.com/UpstageAI/korean-tax-mcp"
Documentation = "https://github.com/UpstageAI/korean-tax-mcp/blob/main/README-EN.md"
Changelog = "https://github.com/UpstageAI/korean-tax-mcp/blob/main/CHANGELOG.md"
"Use cases" = "https://upstageai.github.io/korean-tax-mcp/use-cases/"

[project.optional-dependencies]
pdf = ["pypdf>=4"]

[project.scripts]
korean-tax-mcp = "korean_tax_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["korean_tax_mcp"]

[tool.hatch.build.targets.sdist]
exclude = ["eval", "bench"]
